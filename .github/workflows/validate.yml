name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployable files
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/script.js
          grep -q '<meta name="description"' dist/index.html
